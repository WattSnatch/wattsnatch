name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # keytar's native build needs libsecret on Linux; better-sqlite3 needs
      # a compiler toolchain to build its native binding.
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
